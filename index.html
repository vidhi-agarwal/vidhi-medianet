<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts · Media.net APM case study</title>
<style>
:root{--bg:#fafaf7;--fg:#141414;--muted:#666;--card:#fff;--line:#e4e2dc;--accent:#1a1a1a}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f0;--muted:#a0a0a0;--card:#1c1c1c;--line:#2e2e2e;--accent:#f2f2f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
main{max-width:640px;width:100%}h1{font-size:44px;margin:0 0 8px;letter-spacing:-.02em}p.lede{color:var(--muted);margin:0 0 32px;font-size:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
a.card{display:block;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}a.card strong{display:block;font-size:20px;margin-bottom:4px}a.card span{color:var(--muted);font-size:14px}
footer{margin-top:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Receipts</h1>
<p class="lede">The only brief that shows its receipts and dares to say nothing happened. A Media.net APM case study.</p>
<div class="grid">
<a class="card" href="/deck"><strong>Pitch deck →</strong><span>Problem, MVP, metrics, risks and rollout</span></a>
<a class="card" href="/prototype"><strong>Prototype →</strong><span>Clickable working demo (fictional data)</span></a>
</div>
<footer>Vidhi Agarwal</footer>
</main>
</body>
</html>
